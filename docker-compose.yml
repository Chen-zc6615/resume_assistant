services:
  db:
    image: postgres:17-alpine
    container_name: smartresume-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-test:
    image: postgres:17-alpine
    container_name: smartresume-db-test
    environment:
      POSTGRES_USER: resume_test
      POSTGRES_PASSWORD: resume_test
      POSTGRES_DB: resume_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resume_test -d resume_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: smartresume-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      # 上传的简历文件保存在宿主机 ./data 目录
      - ./data:/app/data
      # 密钥配置只读挂载（不入镜像、不入 git）
      - ./.env:/app/.env:ro
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/resumes/stats', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:stable-alpine
    container_name: smartresume-nginx
    restart: unless-stopped
    ports:
      # 服务器为共享机：80/8000/8084 已被占用（系统 nginx 与既有服务）
      # 8084 保留作备选方案，本服务使用 18085
      - "18085:80"
    volumes:
      # 前端静态文件（vite build 产物）
      - ./src/web/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  postgres_data:
