services:
  db:
    image: ghcr.io/chen-zc6615/resume_assistant:postgres-17-alpine
    container_name: resume-assistant-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    mem_limit: 512m


  app:
    image: ghcr.io/chen-zc6615/resume_assistant:${IMAGE_TAG:-latest}
    container_name: resume-assistant
    restart: unless-stopped

    init: true

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}

    depends_on:
      db:
        condition: service_healthy

    ports:
      - "127.0.0.1:18085:8000"

    volumes:
      - ./data:/app/data

    mem_limit: 1g

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
