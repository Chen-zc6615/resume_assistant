services:
  db:
    image: ghcr.io/chen-zc6615/resume_assistant:postgres-17-alpine
    container_name: resume-assistant-db
    restart: unless-stopped

    networks: [back]

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    mem_limit: 512m

  app:
    image: ghcr.io/chen-zc6615/resume_assistant:app-${IMAGE_TAG:-latest}
    container_name: resume-assistant-app
    restart: unless-stopped

    networks: [front, back]

    init: true

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PARSER_SERVICE_BASE_URL: http://parser:8002
      KNOWLEDGE_SERVICE_BASE_URL: http://knowledge:8001

    depends_on:
      db:
        condition: service_healthy
      parser:
        condition: service_started
      knowledge:
        condition: service_started

    volumes:
      - ./data:/app/data

    mem_limit: 1g

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/auth/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  web:
    image: ghcr.io/chen-zc6615/resume_assistant:web-${IMAGE_TAG:-latest}
    container_name: resume-assistant-web
    restart: unless-stopped

    networks: [front]

    depends_on:
      app:
        condition: service_healthy

    ports:
      - "127.0.0.1:18080:80"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  parser:
    image: ghcr.io/chen-zc6615/resume_assistant:parser-${IMAGE_TAG:-latest}
    container_name: resume-assistant-parser
    restart: unless-stopped

    networks: [back]

    init: true

    environment:
      MODEL_API_KEY: ${MODEL_API_KEY:-${DASHSCOPE_API_KEY:-}}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}

    mem_limit: 1g

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  knowledge:
    image: ghcr.io/chen-zc6615/resume_assistant:knowledge-${IMAGE_TAG:-latest}
    container_name: resume-assistant-knowledge
    restart: unless-stopped

    networks: [back]

    init: true

    environment:
      MODEL_API_KEY: ${MODEL_API_KEY:-${DASHSCOPE_API_KEY:-}}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen3-embedding-8b}
      RERANK_MODEL: ${RERANK_MODEL:-qwen3-reranker-8b}
      KNOWLEDGE_DATA_DIR: /app/data

    volumes:
      - knowledge_data:/app/data

    mem_limit: 1g

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:
  knowledge_data:

networks:
  front: {}
  back: {}
