services:
  db:
    image: postgres:17-alpine
    container_name: smartresume-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-test:
    image: postgres:17-alpine
    container_name: smartresume-db-test
    environment:
      POSTGRES_USER: resume_test
      POSTGRES_PASSWORD: resume_test
      POSTGRES_DB: resume_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resume_test -d resume_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 主服务：业务主线 + 前端；经 HTTP 调用解析服务
  app:
    build:
      context: .
      dockerfile: services/app/Dockerfile
    container_name: smartresume-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PARSER_SERVICE_BASE_URL: http://parser:8002
      KNOWLEDGE_SERVICE_BASE_URL: http://knowledge:8001
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
    volumes:
      # 上传的简历文件保存在宿主机 ./data 目录
      - ./data:/app/data
    ports:
      - "127.0.0.1:18085:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/resumes/stats', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      # 解析服务不可用不应阻止主服务启动（简历落「解析失败」可重试）
      parser:
        condition: service_started
      knowledge:
        condition: service_started

  # 解析服务：PDF -> 文本（PyMuPDF/pdfplumber/OCR 三级兜底）
  parser:
    build:
      context: .
      dockerfile: services/parser/Dockerfile
    container_name: smartresume-parser
    restart: unless-stopped
    environment:
      MODEL_API_KEY: ${MODEL_API_KEY:-${DASHSCOPE_API_KEY:-}}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      OCR_MODEL: ${OCR_MODEL:-qwen-vl-max}
    ports:
      - "127.0.0.1:8002:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # 知识库服务：人才库 Wiki 卡片索引与混合检索
  knowledge:
    build:
      context: .
      dockerfile: services/knowledge/Dockerfile
    container_name: smartresume-knowledge
    restart: unless-stopped
    environment:
      MODEL_API_KEY: ${MODEL_API_KEY:-${DASHSCOPE_API_KEY:-}}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen3-embedding-8b}
      RERANK_MODEL: ${RERANK_MODEL:-qwen3-reranker-8b}
      KNOWLEDGE_DATA_DIR: /app/data
    volumes:
      - knowledge_data:/app/data
      # 人才 Wiki 卡片 Markdown 副本落盘到宿主，供人工阅读与 git 管理
      - ./data/wiki:/app/data/wiki
    ports:
      - "127.0.0.1:8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
  knowledge_data:
