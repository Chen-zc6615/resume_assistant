services:
  db:
    image: postgres:17-alpine
    container_name: resume-assistant-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-test:
    image: postgres:17-alpine
    container_name: resume-assistant-db-test
    environment:
      POSTGRES_USER: resume_test
      POSTGRES_PASSWORD: resume_test
      POSTGRES_DB: resume_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resume_test -d resume_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 知识图谱存储：简历·岗位技能图谱（graph 服务专用）
  neo4j:
    image: neo4j:5.26-community
    container_name: resume-assistant-neo4j
    restart: unless-stopped
    environment:
      # 初始管理员账号必须叫 neo4j；仅首次初始化数据卷时生效
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?请在 .env 设置 NEO4J_PASSWORD}
      # 限制内存占用（约 1.5G），避免 JVM 按整机内存自动分配
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
      NEO4J_server_memory_pagecache_size: 512m
    ports:
      - "127.0.0.1:7474:7474"   # 浏览器管理界面
      - "127.0.0.1:7687:7687"   # bolt 连接端口（代码用这个）
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # 图服务集成测试专用 Neo4j：数据放 tmpfs，重建即清；测试会全库清空，严禁指向 neo4j 主库
  # 社区版只有单库无法按库名隔离，所以用独立容器 + 独立端口（与 db-test 同一思路）
  neo4j-test:
    image: neo4j:5.26-community
    container_name: resume-assistant-neo4j-test
    environment:
      NEO4J_AUTH: neo4j/test-password-123
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 128m
    ports:
      - "127.0.0.1:57687:7687"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # 主服务：业务主线纯 API；前端独立部署（web 服务）
  app:
    build:
      context: .
      dockerfile: services/app/Dockerfile
    container_name: resume-assistant-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PARSER_SERVICE_BASE_URL: http://parser:8002
      KNOWLEDGE_SERVICE_BASE_URL: http://knowledge:8001
      LLM_API_KEY: ${LLM_API_KEY:-}
      # 容器内无 .env，须显式传入归一化/Agent 模型端点，否则回退官方地址
      LLM_BASE_URL: ${LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen-plus}
    volumes:
      # 上传的简历文件保存在宿主机 ./data 目录
      - ./data:/app/data
    ports:
      - "127.0.0.1:18085:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/auth/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      # 解析服务不可用不应阻止主服务启动（简历落「解析失败」可重试）
      parser:
        condition: service_started
      knowledge:
        condition: service_started

  # 前端：独立 nginx 容器托管 Vue 产物，/api 反代 app（前后端分离）
  web:
    build:
      context: services/app/web
      dockerfile: Dockerfile
    container_name: resume-assistant-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      app:
        condition: service_started

  # 解析服务：PDF -> 文本（PyMuPDF/pdfplumber/OCR 三级兜底）
  parser:
    build:
      context: .
      dockerfile: services/parser/Dockerfile
    container_name: resume-assistant-parser
    restart: unless-stopped
    environment:
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      OCR_MODEL: ${OCR_MODEL:-qwen-vl-max}
    ports:
      - "127.0.0.1:8002:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # 知识库服务：人才库 Wiki 卡片索引与混合检索
  knowledge:
    build:
      context: .
      dockerfile: services/knowledge/Dockerfile
    container_name: resume-assistant-knowledge
    restart: unless-stopped
    environment:
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen3-embedding-8b}
      RERANK_MODEL: ${RERANK_MODEL:-qwen3-reranker-8b}
      KNOWLEDGE_DATA_DIR: /app/data
    volumes:
      - knowledge_data:/app/data
      # 人才 Wiki 卡片 Markdown 副本落盘到宿主，供人工阅读与 git 管理
      - ./data/wiki:/app/data/wiki
    ports:
      - "127.0.0.1:8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
  knowledge_data:
  neo4j_data:
