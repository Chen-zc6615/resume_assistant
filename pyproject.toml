[project]
name = "resume-assistant"
version = "0.1.0"
description = "智能简历筛选助手：批量解析、归一化、硬性初筛、人工审核入库"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "litellm>=1.106.1",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.4",
]

# 本仓库为 uv workspace：根目录仅作总调度，不承载业务代码。
[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/*", "packages/*"]

# 仓库级开发工具（三个服务共享一套）
[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
