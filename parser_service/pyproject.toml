[project]
name = "resume-parser-service"
version = "0.1.0"
description = "Independent PDF parsing and OCR service for Smart Resume"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "openai>=1.40",
    "pdfplumber>=0.11",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pymupdf>=1.24",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
]

[tool.ruff]
line-length = 100
target-version = "py312"

