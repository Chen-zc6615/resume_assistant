[project]
name = "resume-shared"
version = "0.1.0"
description = "Smart Resume 服务间共享代码（PDF 校验等）"
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=1.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resume_shared"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
