name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend tests
    needs: containers
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: resume_test
          POSTGRES_PASSWORD: resume_test
          POSTGRES_DB: resume_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resume_test -d resume_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://resume_test:resume_test@127.0.0.1:5432/resume_test

    steps:
      - name: Require all service images to build
        run: test "${{ needs.containers.result }}" = "success"

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python and uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: uv sync --all-packages --frozen

      - name: Check backend style
        run: uv run ruff check services packages

      - name: Apply database migrations
        run: uv run alembic upgrade head

      # 各服务的 tests/ 都是 Python 包；分进程执行以避免同名
      # tests.conftest 在 pytest 收集阶段发生 ImportPathMismatchError。
      - name: Run app service tests
        run: uv run pytest services/app/tests -v

      - name: Run parser service tests
        run: uv run pytest services/parser/tests -v

      - name: Run knowledge service tests
        run: uv run pytest services/knowledge/tests -v

  frontend:
    name: Frontend type check and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: services/app/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/app/web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Check types and build
        run: npm run build

  containers:
    name: Container build (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [app, parser, knowledge]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
