# 前端独立部署的 nginx 配置：静态托管 + SPA history 回退 + /api 反代后端
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vue Router history 模式：未命中的路径回退 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反代到后端 app 服务（compose 网络内按服务名寻址）
    location /api/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;      # Agent 任务对话（LLM 多轮）耗时较长
        proxy_buffering off;          # SSE 流式输出（/api/tasks/*/messages/stream）不缓冲
    }

    # 带指纹的静态资源长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
