[project]
name = "resume-app-service"
version = "0.1.0"
description = "智能简历筛选助手主服务：上传、归一化、分配、初筛、审核"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    "openai>=1.40",
    "litellm>=1.0",
    "jsonschema>=4.22",
    "rapidfuzz>=3.9",
    "dateparser>=1.2",
    "python-multipart>=0.0.9",
    "resume-shared",
]

[tool.uv.sources]
resume-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
