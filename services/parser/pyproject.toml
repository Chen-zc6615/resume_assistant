[project]
name = "resume-parser-service"
version = "0.1.0"
description = "Independent PDF parsing and OCR service for Smart Resume"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "openai>=1.40",
    "pdfplumber>=0.11",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pymupdf>=1.24",
    "python-multipart>=0.0.9",
    "resume-shared",
    "uvicorn[standard]>=0.30",
]

[tool.uv.sources]
resume-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parser_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

