[project]
name = "resume-graph-service"
version = "0.1.0"
description = "Resume / job skill knowledge graph service backed by Neo4j"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "neo4j>=5.26",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "uvicorn[standard]>=0.30",
    "litellm>=1.106.1",
    "jsonschema>=4.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graph_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
